; MagicPilot LIVE – M5Stack Tab5: Blackmagic camera picture (HDMI over USB UVC) and Bluetooth control
; Build/flash:  pio run -t upload && pio device monitor
;
; The project uses the native ESP-IDF layout (main/ folder), so it can also be
; built with plain ESP-IDF: idf.py set-target esp32p4 build flash monitor

[platformio]
src_dir = main

[env:m5stack-tab5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = m5stack-tab5-p4
framework = espidf
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
