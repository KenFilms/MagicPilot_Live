dependencies:
  idf: ">=5.5.3"
  espressif/m5stack_tab5_noglib: "^1.3.2"
  # usb_host_uvc 2.6.0 is vendored in ../components/usb_host_uvc (2.5+ fixes hot-unplug
  # aborts and URB sizing needed for HDMI capture adapters).
